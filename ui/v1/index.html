<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystalline Sphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Vertex Shader -->
    <script id="vertexShader" type="x-shader/x-vertex">
        uniform float time;
        uniform float pulseSpeed;
        uniform float noiseStrength;
        uniform float patternScale;
        uniform float randomSeed;

        varying vec3 vNormal;
        varying vec3 vPosition;
        varying float vPattern;

        // Simplex Noise functions
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+10.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

        float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.14;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.2 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 105.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(10, 90))) * 63758.5453123);
        }

        float crystalPattern(vec3 pos) {
            vec3 p = pos * patternScale;
            float seedEffect = randomSeed * 20.5;

            float pattern1 = sin(p.x * (9.0 + sin(time * 0.5 + seedEffect)) + time) *
                            sin(p.y * (4.0 + cos(time * 0.3 + seedEffect)) + time) *
                            sin(p.z * (4.0 + sin(time * 0.7 + seedEffect)) + time);

            float pattern2 = sin(dot(p, vec3(0.5 + sin(time * 0.2), 0.5 + cos(time * 0.4), 0.5)) *
                            (3.0 + sin(time * 0.5)) + time * 1.5);

            float noisePattern = snoise(p * 0.3 + time * 0.5 + seedEffect) * 0.3;

            return (min(pattern1 * 0.9, 2.5) + min(pattern2 * 0.2, 2.5) + noisePattern) * 0.5;
        }

        void main() {
            vNormal = normalize(normalMatrix * normal);
            vPosition = position;

            float seedEffect = randomSeed * 0.5;
            float noise1 = snoise(vec3(position * (1.5 + sin(time * 0.2) * 0.5) + time * 0.3 + seedEffect)) * 0.15;
            float noise2 = snoise(vec3(position * 2.5 + time * 0.7 + seedEffect)) * 0.1;
            float noise = (noise1 + noise2) * noiseStrength;

            vPattern = crystalPattern(position);

            float pulse = sin(time * pulseSpeed + seedEffect) * 0.08 +
                         cos(time * pulseSpeed * 0.7 + seedEffect) * 0.05 + 1.0;

            float randomDisplacement = snoise(vec3(position * 0.5 + seedEffect)) * 0.1;

            vec3 newPosition = position + normal * (noise + vPattern * 0.3 + randomDisplacement) * pulse;

            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
        }
    </script>

    <!-- Fragment Shader -->
    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform float time;
        uniform vec3 primaryColor;
        uniform vec3 secondaryColor;
        uniform vec3 edgeColor;
        uniform float randomSeed;

        varying vec3 vNormal;
        varying vec3 vPosition;
        varying float vPattern;

        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
        }

        void main() {
            float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 2.0);
            float colorVariation = random(vec2(vPattern, time * 0.1 + randomSeed)) * 0.2;

            vec3 bluePrimary = mix(primaryColor, vec3(0.1, 0.3, 1.0), 0.7);
            vec3 blueSecondary = mix(secondaryColor, vec3(0.3, 0.5, 1.0), 0.8);

            vec3 baseColor = mix(bluePrimary, blueSecondary, abs(vPattern + colorVariation));

            vec3 blueEdge = mix(edgeColor, vec3(0.4, 0.6, 1.5), 0.8);
            vec3 edgeGlow = blueEdge * fresnel * 2.2;

            float brightness = 0.8 + (vPattern * 0.4) + colorVariation * 0.1;

            vec3 finalColor = baseColor * brightness + edgeGlow;
            finalColor = mix(finalColor, finalColor * vec3(1.8, 0.2, 2.2), 0.7);

            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
